name: Release artifacts

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: ./scripts/test.sh
      - run: python -m pip install --disable-pip-version-check build
      - run: python -m build
      - run: python scripts/check-release.py --write-checksums
      - run: ./scripts/test-install.sh dist/buzz_agent_observability-0.1.0-py3-none-any.whl
      - uses: actions/upload-artifact@v4
        with:
          name: buzz-agent-observability-${{ github.ref_name }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
